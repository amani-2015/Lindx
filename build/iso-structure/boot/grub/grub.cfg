set timeout_style=menu
set timeout=5
set default=0

menuentry "Lindx OS (Live Standard)" {
    linux /boot/vmlinuz boot=live live-media-path=/live/ loop.max_loop=8 console=ttyS0 console=ttyS0
    initrd /boot/initrd.img
}

menuentry "Lindx OS (Safe Mode / Nomodeset)" {
    linux /boot/vmlinuz boot=live nomodeset
    initrd /boot/initrd.img
}
